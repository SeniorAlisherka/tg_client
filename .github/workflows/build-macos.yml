name: Build macOS Binary

on:
  push:
    tags:
      - "v*"
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- Write Google JSON file from secret ---
      - name: Write Google service account JSON
        run: |
          mkdir -p materials/secrets
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_RAW }}' > materials/secrets/ck-bot-480600-d087c362cbd6.json

      # --- Write .env file from secrets ---
      - name: Write .env
        run: |
          echo "TG_API_ID=${{ secrets.TG_API_ID }}" >> .env
          echo "TG_API_HASH=${{ secrets.TG_API_HASH }}" >> .env
          echo "GOOGLE_SERVICE_ACCOUNT_JSON=${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}" >> .env
          echo "GOOGLE_USERS_SPREADSHEET_ID=${{ secrets.GOOGLE_USERS_SPREADSHEET_ID }}" >> .env
          echo "GOOGLE_USERS_SHEET_RANGE=${{ secrets.GOOGLE_USERS_SHEET_RANGE }}" >> .env
          echo "TDLIB_PATH=materials/libtdjson.dylib" >> .env
          echo "DEV_MODE=${{ secrets.DEV_MODE }}" >> .env

      # --- Build executable ---
      - name: Build binary
        run: |
          chmod +x ./build_exec.sh
          ./build_exec.sh

      # --- Create GitHub Release with asset ---
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            dist/TG_Client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}