name: Build macOS Binary

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          brew install create-dmg

      - name: Write Google JSON file from secret
        run: |
          mkdir -p materials/secrets
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_RAW }}' > materials/secrets/ck-bot-480600-d087c362cbd6.json

      - name: Write .env
        run: |
          echo "TG_API_ID=${{ secrets.TG_API_ID }}" >> .env
          echo "TG_API_HASH=${{ secrets.TG_API_HASH }}" >> .env
          echo "GOOGLE_SERVICE_ACCOUNT_JSON=${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}" >> .env
          echo "GOOGLE_USERS_SPREADSHEET_ID=${{ secrets.GOOGLE_USERS_SPREADSHEET_ID }}" >> .env
          echo "GOOGLE_USERS_SHEET_RANGE=${{ secrets.GOOGLE_USERS_SHEET_RANGE }}" >> .env
          echo "TDLIB_PATH=${{ secrets.TDLIB_PATH }}" >> .env
          echo "DEV_MODE=${{ secrets.DEV_MODE }}" >> .env

      - name: Build application (DMG)
        run: |
          chmod +x ./build_app.sh
          ./build_app.sh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            dist/TG_Client.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}